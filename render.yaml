services:
  - type: web
    name: epic-learning-pro-api
    runtime: node
    plan: free
    buildCommand: "npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build"
    startCommand: "pnpm --filter @workspace/api-server run start"
    envVars:
      - key: NODE_ENV
        value: production
      # Render provides PORT automatically — do not add it here
      - key: SMTP_HOST
        sync: false          # you'll fill this in on Render's dashboard
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
